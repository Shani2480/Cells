[package]
name = "cells"
version = "0.5.0"
description = "Cells spreadsheet"
authors = ["The Cells authors"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name apart from the bin name (a Windows quirk, cargo#8519).
name = "cells_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
