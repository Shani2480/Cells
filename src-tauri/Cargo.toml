[package]
name = "cells"
version = "0.7.0"
description = "Cells spreadsheet"
authors = ["The Cells authors"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name apart from the bin name (a Windows quirk, cargo#8519).
name = "cells_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# AI tools (src/ai.rs): the providers Inkspire uses, and its keyring entries.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "macros"] }
keyring = { version = "3", default-features = false }

# Touchpad pinch on Linux: caught on the webview before WebKitGTK's page zoom (src/pinch.rs). Tauri's own versions.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"

[target.'cfg(target_os = "linux")'.dependencies.keyring]
version = "3"
default-features = false
features = ["sync-secret-service", "crypto-rust"]

[target.'cfg(target_os = "macos")'.dependencies.keyring]
version = "3"
default-features = false
features = ["apple-native"]

[target.'cfg(target_os = "windows")'.dependencies.keyring]
version = "3"
default-features = false
features = ["windows-native"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
