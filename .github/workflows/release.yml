name: Release

# Builds the installers from one tag and attaches them to a GitHub release (docs/release.md):
# a .deb and an AppImage (built on Ubuntu 22.04 so they run on older distributions too), a Flatpak made from that
# .deb, a Windows setup .exe (NSIS) and a macOS .dmg (Apple Silicon and Intel in one).
# The release text is the version's notes from app/src/about/release-notes.ts, as What's New shows them.
# Push a tag such as v0.6.0, or run it by hand with the tag to publish.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (created on the current commit when missing), e.g. v0.6.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  draft:
    name: Draft the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check the tag, the version and the notes agree
        run: |
          version=$(node -p 'require("./package.json").version')
          test "v$version" = "$TAG" || { echo "The tag $TAG is not v$version (package.json)"; exit 1; }
          node scripts/release-notes.mjs --metainfo
          node scripts/release-notes.mjs "$version" > "$RUNNER_TEMP/notes.md"
      - name: Create the draft release (or reuse it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Cells $TAG" \
              --notes-file "$RUNNER_TEMP/notes.md"

  linux:
    name: Linux (.deb, AppImage)
    needs: draft
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev patchelf file
      - run: npm ci
      - run: npm run tauri build -- --bundles deb,appimage
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/appimage/*.AppImage --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: src-tauri/target/release/bundle/deb/*.deb

  flatpak:
    name: Flatpak
    needs: linux
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: packaging/flatpak
      - name: Name the .deb for the manifest
        run: mv packaging/flatpak/*.deb packaging/flatpak/cells.deb
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: Cells.flatpak
          manifest-path: packaging/flatpak/app.cells.desktop.yml
          cache: false
          upload-artifact: false
      - name: Name the bundle
        run: mv Cells.flatpak "Cells_${TAG#v}_x86_64.flatpak"
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: Cells_*_x86_64.flatpak

  windows:
    name: Windows (setup .exe)
    needs: draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run tauri build -- --bundles nsis
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" src-tauri/target/release/bundle/nsis/*.exe --clobber

  macos:
    name: macOS (.dmg)
    needs: draft
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      # One app for Apple Silicon and Intel, signed ad hoc (no Apple Developer ID, so not notarized: the first open
      # needs right-click › Open).
      - run: npm run tauri build -- --target universal-apple-darwin --bundles dmg
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg --clobber

  publish:
    name: Publish the release
    needs: [linux, flatpak, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flatpak
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" Cells_*_x86_64.flatpak --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
